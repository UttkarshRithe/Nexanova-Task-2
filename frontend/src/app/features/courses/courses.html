<mat-sidenav-container class="min-h-screen">
  <mat-sidenav mode="side" opened style="background-color: transparent; border-right: none;">
    <app-sidebar />
  </mat-sidenav>

  <mat-sidenav-content style="background-color: transparent;">
    <app-navbar />

    <div class="p-6 md:p-8">
      <div class="flex items-end justify-between mb-6">
        <div>
          <div class="text-2xl font-bold mb-1">Courses</div>
          <div class="text-sm app-muted">Manage course catalog and syllabus</div>
        </div>

        <button class="btn-primary flex items-center h-10" (click)="openAddCourseDialog()">
          <mat-icon class="mr-1 text-[20px] h-[20px] w-[20px]">add</mat-icon>
          Add Course
        </button>
      </div>

      <div class="app-card rounded-xl overflow-hidden p-0 border" style="border-color: var(--border);">
        <div *ngIf="loading()" class="flex items-center justify-center gap-3 app-muted p-12">
          <mat-spinner diameter="24"></mat-spinner>
          Loading courses...
        </div>

        <div *ngIf="!loading() && courses().length === 0" class="app-muted text-sm text-center p-12">
          No courses found. click "Add Course" to create one.
        </div>

        <table mat-table [dataSource]="courses()" class="w-full" *ngIf="!loading() && courses().length > 0">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="font-semibold px-4">ID</th>
            <td mat-cell *matCellDef="let row" class="px-4 text-sm">{{ row.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="font-semibold px-4">Course Name</th>
            <td mat-cell *matCellDef="let row" class="px-4 font-medium text-white">{{ row.name }}</td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef class="font-semibold px-4 w-1/3">Description</th>
            <td mat-cell *matCellDef="let row" class="px-4 text-sm app-muted truncate max-w-xs">{{ row.description || '-' }}</td>
          </ng-container>

          <ng-container matColumnDef="duration">
            <th mat-header-cell *matHeaderCellDef class="font-semibold px-4">Duration</th>
            <td mat-cell *matCellDef="let row" class="px-4 text-sm">
              <div class="flex items-center gap-1 app-muted">
                <mat-icon class="text-[16px] h-[16px] w-[16px]">schedule</mat-icon>
                {{ row.duration || '-' }}
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-right px-4 font-semibold">Actions</th>
            <td mat-cell *matCellDef="let row" class="text-right px-4 space-x-2">
              <button class="btn-secondary h-8 px-3 text-xs" (click)="openEditCourseDialog(row)">
                <mat-icon class="text-[16px] h-[16px] w-[16px] mr-1 align-text-bottom">edit</mat-icon> Edit
              </button>
              <button class="btn-secondary h-8 px-3 text-xs border-red-900 text-red-400 hover:bg-red-900/20" (click)="deleteCourse(row.id)">
                <mat-icon class="text-[16px] h-[16px] w-[16px] mr-1 align-text-bottom">delete</mat-icon> Delete
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:bg-[var(--bg-hover)] transition-colors"></tr>
        </table>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
